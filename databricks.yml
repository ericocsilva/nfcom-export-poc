# Databricks Asset Bundle - NFCom XML Export PoC
# Exports NF-Com XML files to Databricks Volumes with high-performance parallel processing

bundle:
  name: nfcom-export-poc

variables:
  catalog:
    default: ericos_catalog
    description: Unity Catalog catalog name
  schema:
    default: godata
    description: Schema name for NFCom PoC
  volume:
    default: xml_exports
    description: Volume name for exported XML files
  table:
    default: nfcom_data
    description: Delta table storing NFCom records

resources:
  jobs:
    nfcom_export_job:
      name: "NFCom - Export XML Files"
      description: >
        High-performance parallel export of NFCom XML records to individual files
        in a Databricks Volume. Accepts EMPRESA, UF, ANO, MES, DIA filters;
        empty values act as wildcard (*). Designed for up to 1 billion records.
      parameters:
        - name: empresa
          default: ""
        - name: uf
          default: ""
        - name: ano
          default: ""
        - name: mes
          default: ""
        - name: dia
          default: ""
      tasks:
        - task_key: export_xml
          notebook_task:
            notebook_path: ./notebooks/02_export_xml.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"
              table: "${var.table}"
              volume_path: "/Volumes/${var.catalog}/${var.schema}/${var.volume}"
              empresa: "{{job.parameters.empresa}}"
              uf: "{{job.parameters.uf}}"
              ano: "{{job.parameters.ano}}"
              mes: "{{job.parameters.mes}}"
              dia: "{{job.parameters.dia}}"
          job_cluster_key: export_cluster
      job_clusters:
        - job_cluster_key: export_cluster
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: "i3.2xlarge"
            num_workers: 4
            data_security_mode: SINGLE_USER
            spark_conf:
              spark.databricks.delta.preview.enabled: "true"
              spark.sql.shuffle.partitions: "auto"
            aws_attributes:
              first_on_demand: 1
              availability: SPOT_WITH_FALLBACK
              spot_bid_price_percent: 100

  apps:
    nfcom_export_app:
      name: "nfcom-export-app"
      description: "NFCom XML Export - Filter and trigger parallel XML file generation"
      source_code_path: ./app
      resources:
        - name: nfcom-export-job
          job:
            id: ${resources.jobs.nfcom_export_job.id}
            permission: CAN_MANAGE_RUN

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://e2-demo-field-eng.cloud.databricks.com
      profile: oneenv
    variables:
      catalog: ericos_catalog
      schema: godata

  prod:
    mode: production
    workspace:
      host: https://e2-demo-field-eng.cloud.databricks.com
      profile: oneenv
    variables:
      catalog: ericos_catalog
      schema: godata
